        }

            margin-bottom: 20px;
            color: #38bdf8;

        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            min-width: 70px;
            border: 1px solid #334155;
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .time-box label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            border-color: #38bdf8;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #0ea5e9;
        }

        .message-box {
            margin-top: 25px;
            padding: 20px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .error-msg {
            color: #f43f5e;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
